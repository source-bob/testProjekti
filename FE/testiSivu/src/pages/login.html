<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script type="module" src="/src/js/auth.js"></script>
<body>
    <div class="app">
        <form class="loginForm">
            <label for="username2">Username</label>
            <br>
            <input type="text" id="username2" name="username2" placeholder="name" value="name" />
            <br>
            <label for="password2">Password</label>
            <br>
            <input
              type="password"
              id="password2"
              name="password2"
              placeholder="name123"
              value="name"
            />
            <br>
            <input
              name="submit"
              id="submitButton"
              type="submit"
              value="Login and get new token"
            />
        </form>
    </div>
</body>
